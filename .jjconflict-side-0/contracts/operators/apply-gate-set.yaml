schema: operator-contract-v1
source: agents/apply-gate-set.md
model: gpt-medium
description: Shared active gate-set owner that verifies implementation Phase 4 estimate write/no-write disposition, dispatches required gate children, owns join/currentness/exception rows and expected-process projection, and refuses silent inheritance.
