# Contextual direct-dispatch bindings: the one place to change which provider,
# native model and effort a run context receives. Data only; the resolution
# order lives in README.md and dispatch.py. Seat names and classes are the
# caller's assertions, not something the dispatcher verifies.

# Round-robin counters (one per pool), updated under an exclusive file lock.
[rotation]
state_dir = "~/.local/state/direct-child"

[providers.codex]
# Automatic allocation pool. .codex and .codex3 stay manual-only via --profile.
pool = [".codex2", ".codex4", ".codex5"]
manual_profiles = [".codex", ".codex2", ".codex3", ".codex4", ".codex5"]
efforts = ["minimal", "low", "medium", "high", "xhigh", "max"]

[providers.claude]
# The original store. Direct runs use the claude5 wrapper (it sets
# CLAUDE_CONFIG_DIR=~/.claude5); native runs do not run the wrapper: the
# site route names .claude5 and Claude Code uses its own login there. Native
# Claude bindings name this store and require a one-store pool. No rotation.
pool = ["claude5"]
manual_profiles = ["claude5"]
efforts = ["low", "medium", "high", "xhigh", "max"]

# How a resolved binding runs. "direct" runs the CLI (launch.sh or claude5);
# "native" runs the installed Linux native ACP v2 caller for an exact declared
# binding; unmapped bindings run direct by rule. --transport direct explicitly
# selects the CLI. Native failure never falls back or replays the task.
[transport]
default = "native"

[native]
# Selected package target: Runner a8e9bfef0f7f, agent-bash de23d83ac522.
# This path selects the installation; schemas/capabilities govern compatibility.
# ROOT selected the installed target after the collected Luna/C4 encounter,
# U472 Frame and U473 D-B1/D-B2 Decision; see README.md for scope and evidence.
# ROOT owns matching site/account routes with production discard and activation
# by advancing live /home/nes/ai; user selection and owned 315 retirement follow.
# This declaration alone attests no activation or general runtime qualification.
# No stable alias, shim or readiness guard.
caller = "/opt/oulipoly-native/oulipoly-native-linux-x86_64-a8e9bfef0f7f-de23d83ac522/bin/oulipoly-native-call"
# Front-door deadline (also its kill bound); --native-deadline overrides.
deadline_s = 7200
# Upper bound checked before any allocation or write: the caller
# refuses above 7200. The site's max_deadline_s may be lower; the front door
# then refuses (caller 4). Declared, not read back.
max_deadline_s = 7200

# Requester-side declaration of site routes registered in the root-owned site
# config. A request names the site route only; the site fixes provider, model,
# effort and the account store (a Codex route's adapter settings_id selects
# the original ~/.codexN store and owns its authentication). Only an exactly
# matching binding can run natively: with default native, any other binding
# runs direct by rule; an explicit --transport native for it is refused.
# A Codex binding maps each Codex profile it serves to that profile's own
# site route: rotation (or an explicit --profile) picks the profile, then its
# route, and an explicit profile missing here is a different binding. Every
# pool profile must be mapped. A Claude binding names its one store: the site
# route fixes ~/.claude5, so only the original claude5 store maps.
# Native children (--native-child-route) are refused pending ROOT's child
# account decision; no child offers are declared.
[[native.bindings]]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"
[native.bindings.site_routes]
".codex" = "sol-high-codex"
".codex2" = "sol-high-codex2"
".codex3" = "sol-high-codex3"
".codex4" = "sol-high-codex4"
".codex5" = "sol-high-codex5"

# Standalone Luna (scout/explorer context) on the same per-account routes.
[[native.bindings]]
provider = "codex"
model = "gpt-6-luna"
effort = "max"
[native.bindings.site_routes]
".codex" = "luna-max-codex"
".codex2" = "luna-max-codex2"
".codex3" = "luna-max-codex3"
".codex4" = "luna-max-codex4"
".codex5" = "luna-max-codex5"

[[native.bindings]]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"
profile = "claude5"
site_route = "opus-medium"

[[native.bindings]]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"
profile = "claude5"
site_route = "opus-high"

# Routes: provider-neutral names bound to native model and effort.
[routes.default]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[routes.refine]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"
# Future Sonnet binding is this edit alone:
# provider = "claude"
# model = "claude-sonnet-5-5"
# effort = "high"

[routes.direction]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"

[routes.explore]
provider = "codex"
model = "gpt-6-luna"
effort = "max"

[routes.create]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

# Classes are supplied by the caller. requires_basis rejects a class claim
# without an evidence reference. The route applies when no seat rule decides.
[classes.new-foundation]
requires_basis = true
route = "direction"

[classes.correction]
requires_basis = true
route = "refine"

[classes.unknown]
requires_basis = false
route = "default"

# Seats: a fixed route, or a route per class (must cover every class).
[seats.framer]
route = "direction"

[seats.decider]
route = "direction"

[seats.scout]
route = "explore"

[seats.explorer]
route = "explore"

[seats.observer]
route = "refine"

[seats.investigator.by_class]
new-foundation = "direction"
correction = "refine"
unknown = "direction"

[seats.maker.by_class]
new-foundation = "direction"
correction = "refine"
unknown = "direction"

[seats.method-steward.by_class]
new-foundation = "direction"
correction = "refine"
unknown = "direction"

# Kinds are the caller's claim about the work (see README.md, Kind), never
# inferred from prompt text or file extension. A kind with a route takes that
# route for its listed seats and for launches with no seat, whatever the
# class; an override that resolves anywhere else is refused, and so is the
# kind on any other seat. A kind without a route is recorded only. Changing
# where creative work goes is an edit here, not a per-launch override.
[kinds.creative]
route = "create"
seats = ["maker", "investigator", "method-steward"]

[kinds.technical]

# A plain invocation with no seat and no class.
[legacy]
route = "default"

# Explicit --model aliases. Effort stays literal: gpt-xhigh is xhigh.
[aliases.gpt]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[aliases.gpt-medium]
provider = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[aliases.gpt-high]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[aliases.gpt-xhigh]
provider = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"
