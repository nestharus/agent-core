# Contextual direct-dispatch bindings: the one place to change which provider,
# native model and effort a run context receives. Data only; the resolution
# order lives in README.md and dispatch.py. Seat names and classes are the
# caller's assertions, not something the dispatcher verifies.

# Round-robin counters (one per pool), updated under an exclusive file lock.
[rotation]
state_dir = "~/.local/state/direct-child"

[providers.codex]
# Automatic allocation pool. .codex stays manual-only via --profile.
pool = [".codex2", ".codex3", ".codex4", ".codex5"]
manual_profiles = [".codex", ".codex2", ".codex3", ".codex4", ".codex5"]
efforts = ["minimal", "low", "medium", "high", "xhigh", "max"]

[providers.claude]
# Fixed wrapper (sets CLAUDE_CONFIG_DIR=~/.claude5) for direct runs; native
# Claude bindings name this store and require a one-store pool. No rotation.
pool = ["claude5"]
manual_profiles = ["claude5"]
efforts = ["low", "medium", "high", "xhigh", "max"]

# Per-profile advisory lease (our own file in each Codex profile). The direct
# launcher holds it for its whole Codex run; native holds it for freshness
# check, renewal and access snapshot. A launch waits at most wait_s, then
# refuses. Writers we do not launch (interactive Codex, editors, copies) are
# not covered.
[lease]
wait_s = 120

# How a resolved binding runs. "direct" runs the CLI (launch.sh or claude5);
# "native" runs the installed Linux native ACP v2 caller for an exact declared
# binding; unmapped bindings run direct by rule. --transport direct explicitly
# selects the CLI. Native failure never falls back or replays the task.
[transport]
default = "native"

[native]
caller = "/opt/oulipoly-native/oulipoly-native-linux-x86_64-8c48c7eecb69-add1b251a984/bin/oulipoly-native-call"
# Front-door deadline (also its kill bound); --native-deadline overrides.
deadline_s = 7200
# The access token must still cover deadline + 2 x site grace + front-door
# collection + site margin, plus slack for the time until admission. These
# mirror the root-owned site config; the front door's own check decides.
site_grace_s = 30
site_collection_s = 2
site_margin_s = 300
slack_s = 300
# Bound on one official renewal (codex app-server, account/read refreshToken).
renew_timeout_s = 60

# Requester-side declaration of site routes installed in the root-owned site
# config. A request names the site route only; the site fixes model and effort
# (and, for Claude, the store). Only an exactly matching binding can run
# natively: with default native, any other binding runs direct by rule; an
# explicit --transport native for it is refused. A Codex binding has no
# profile: rotation and the lease supply an access-only credential. A Claude
# binding names its store (profile): the site route fixes ~/.claude5, so only
# the original claude5 store maps, never another store or a store override.
[[native.bindings]]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"
site_route = "sol-high"

[[native.bindings]]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"
profile = "claude5"
site_route = "opus-medium"

[[native.bindings]]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"
profile = "claude5"
site_route = "opus-high"

# Routes: provider-neutral names bound to native model and effort.
[routes.default]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[routes.refine]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"
# Future Sonnet binding is this edit alone:
# provider = "claude"
# model = "claude-sonnet-5-5"
# effort = "high"

[routes.direction]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"

[routes.explore]
provider = "codex"
model = "gpt-6-luna"
effort = "max"

[routes.create]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

# Classes are supplied by the caller. requires_basis rejects a class claim
# without an evidence reference. The route applies when no seat rule decides.
[classes.new-foundation]
requires_basis = true
route = "direction"

[classes.correction]
requires_basis = true
route = "refine"

[classes.unknown]
requires_basis = false
route = "default"

# Seats: a fixed route, or a route per class (must cover every class).
[seats.framer]
route = "direction"

[seats.decider]
route = "direction"

[seats.scout]
route = "explore"

[seats.explorer]
route = "explore"

[seats.observer]
route = "refine"

[seats.investigator.by_class]
new-foundation = "direction"
correction = "refine"
unknown = "direction"

[seats.maker.by_class]
new-foundation = "direction"
correction = "refine"
unknown = "direction"

[seats.method-steward.by_class]
new-foundation = "direction"
correction = "refine"
unknown = "direction"

# Kinds are the caller's claim about the work (see README.md, Kind), never
# inferred from prompt text or file extension. A kind with a route takes that
# route for its listed seats and for launches with no seat, whatever the
# class; an override that resolves anywhere else is refused, and so is the
# kind on any other seat. A kind without a route is recorded only. Changing
# where creative work goes is an edit here, not a per-launch override.
[kinds.creative]
route = "create"
seats = ["maker", "investigator", "method-steward"]

[kinds.technical]

# A plain invocation with no seat and no class.
[legacy]
route = "default"

# Explicit --model aliases. Effort stays literal: gpt-xhigh is xhigh.
[aliases.gpt]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[aliases.gpt-medium]
provider = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[aliases.gpt-high]
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[aliases.gpt-xhigh]
provider = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"
