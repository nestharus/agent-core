linear_client_usage:
  command_prefix: "PYTHONPATH=$HOME/ai python3 -m clients.linear.cli"
  contract:
    route: "Linear issue route = selected team plus optional project plus labels"
    team: "--team or --team-key selects the Linear team and label namespace"
    project: "--project accepts a Linear project UUID or slugId scoped to the selected team"
    labels: "--label is singular and repeatable for create/search/list issue commands; labels resolve in the selected team"
    apply_labels: "apply-labels keeps the plural --labels bulk input"
  examples:
    create_issue: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli create-issue
      --team ACR --project acr-strategy --label hardening --label Bug
      --estimate 5
      --description-file /path/to/brief.md
      --title "Implement project-aware labels"
    search_issues: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli search-issues
      --team-key ACR --project acr-strategy --label hardening --first 25
    list_issues: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli list-issues
      --team ACR --project acr-strategy --label hardening,Bug
    list_projects: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli list-projects
      --team ACR --include-archived
    list_labels: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli list-labels
      --team ACR
    apply_labels: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli apply-labels ACR-113
      --team ACR --labels hardening,Bug
    get_issue: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli get-issue ACR-113
    update_issue: >-
      PYTHONPATH=$HOME/ai python3 -m clients.linear.cli update-issue
      ACR-122 --estimate 13
    transition_issue:
      description: "Acknowledgement-only routine transition; no final state read."
      result:
        requestedStatus: "Normalized caller request"
        initialState: "{id, name} from initial issue read"
        resolvedTarget: "{id, name} from owning team state catalog, not observed final state"
        outcome: "acknowledged (literal mutation success:true) or already_matching (initial ID matched; no mutation)"
      explicit_readback: "After ok:true, run get-issue with data.issue_id. Report its actual data.state separately as a point-in-time observation and compare its ID to resolvedTarget.id. Missing ID, mismatch or read error does not verify the target; retain transition outcome, do not retry or overwrite. Even a match is not a durable guarantee."
      example: >-
        PYTHONPATH=$HOME/ai python3 -m clients.linear.cli transition-issue
        ACR-130 --target-status "In Progress"
      routine_states:
        - Todo
        - In Progress
        - Done
  notes:
    - "Use slugId or UUID for project tokens; project names and URLs are not accepted identifiers."
    - "Team-owned labels win over workspace labels with the same name; duplicate labels in the same tier are ambiguous."
    - "Search and list issue label filters use resolved label IDs, not raw label names."

  project_operations:
    get_project: "get-project <exact-project-UUID>"
    create_project: 'create-project --name "Exact name" --team-id <team-UUID> --project-id <caller-retained-fresh-UUID-v4> [--description "Caller text"]'
    assign_issue_project: "assign-issue-project <issue-key-or-UUID> --project-id <exact-project-UUID>"
    creation: "Retain UUID before dispatch. Complete visible inventory including archived projects is checked; name or ID candidates block for exact read/caller selection. One mutation attempt; independent project identity/team/name/optional-description readback. No global uniqueness guarantee."
    failure: "ok:false exits 1 and retains data.projectId, mutation and readback progress. An acknowledged malformed identity echo also retains returnedProjectId. Unknown outcome or readback failure never authorizes create replay; get-project the retained identity and reconcile with root. No persistent retry ledger."
    assignment: "Only projectId is patched using resolved issue UUID after destination team validation. Acknowledgement or already_matching is separate from independent readback=matched. Multi-issue moves are not atomic; retain each result and report unattempted issues. No rollback or unrelated-field restoration."
