schema: operator-contract-v1
source: agents/coderabbit-operator.md
model: gpt-medium
description: One generated CodeRabbit review with independent finding dialogues and exact-current-head approval per PR.
contract_status: minimum-generated-from-operator-sections
inputs:
- name: repo
  type: string
  required: true
  default_source: caller
  description: GitHub repository in owner/name form.
- name: pr_num
  type: integer
  required: true
  default_source: caller
  description: GitHub pull request number.
- name: worktree_path
  type: string
  required: true
  default_source: caller
  description: Absolute path to the exact PR head-branch worktree.
- name: trigger_mode
  type: string
  required: false
  default_source: base
  description: incremental for normal review; full only for declared whole-file review.
- name: initial_trigger
  type: string
  required: false
  default_source: base
  description: auto or skip; skip requires a persisted generation, and neither policy may supersede a completed review generation even after the head changes.
- name: fixer_agent
  type: string
  required: false
  default_source: base
  description: Agent file used for one persisted CodeRabbit finding.
defaults:
- name: trigger_mode
  value: incremental
  source: base
- name: initial_trigger
  value: auto
  source: base
- name: fixer_agent
  value: ~/ai/agents/coderabbit-comment-fixer.md
  source: base
outputs:
- task: is-enabled
  success_shape: Exit 0 when the repository carries the CodeRabbit marker label; exit 1 is clean non-applicability.
  wrote_lines: []
- task: review-loop
  success_shape: JSON containing one completed generation, independently resolved conversations, exact-current-head CodeRabbit approval, iteration outcomes, and persisted single_review_completion evidence; reruns reuse that evidence.
  wrote_lines:
  - generation_result is exactly REVIEW_COMPLETED, RATE_LIMITED_NO_REVIEW, WAITING_FOR_REVIEW, or BLOCKED.
  - REVIEW_COMPLETED includes a new baseline-external accepted_review_id bound to expected_head_oid with submitted_at no earlier than the trigger.
  - terminal_reason=approved requires every scoped review thread to report isResolved=true and a CodeRabbit APPROVED review bound to the exact final head; fixes and dialogue replies request no follow-up review generation.
  - RATE_LIMITED_NO_REVIEW includes exact trigger-bound rate-limit evidence and capacity-query evidence when queried.
- task: poll
  success_shape: JSON generation evidence plus normalized comment metadata and persisted body paths.
  wrote_lines: []
- task: open-findings
  success_shape: Read-only JSON unresolved finding inventory with review/comment/thread IDs, URL, provider-bound in-diff head OID, null outside-diff head OID, resolution, and body_path.
  wrote_lines: []
- task: capacity
  success_shape: JSON with one exact capacity-query generation and its bound provider response or BLOCKED result.
  wrote_lines: []
- task: reply
  success_shape: JSON exact-comment reply result with posted/reused and readback identity.
  wrote_lines: []
errors:
- class: RATE_LIMITED_NO_REVIEW
  cause: A trigger-bound authoritative CodeRabbit comment says the review did not run.
  recovery: Use the persisted capacity query and wait for authoritative availability; never infer or storm triggers.
- class: BLOCKED
  cause: Head identity changed, generation evidence is missing/ambiguous, or a capacity/reply readback is invalid.
  recovery: Follow next_permitted_action and preserve the evidence path; do not re-trigger while blocked.
- class: NEEDS_INPUT
  cause: A finding is deferred because it requires a concrete caller-owned decision.
  recovery: Surface the structured per-comment outcome without re-triggering.
side_effects:
- Persists generation state, normalized comment bodies, ordered per-thread conversation histories, and per-conversation awaiting/pushback/resolved state under ~/.cache/coderabbit.
- Persists pre-POST in-flight markers and reconciles exact provider command identities before retrying.
- Uses a PR-scoped non-blocking lock to reject concurrent provider-command invocations.
- Persists a body-revision-bound local fix/reply disposition for handled outside-diff comments.
- May post one review trigger, a retry only when no review completed and capacity allows it, one capacity query per query generation, and exact-comment replies.
- May dispatch fixers, commit their changes, and push the verified PR head branch during review-loop.
must_delegate: []
forbidden_direct:
- Do not infer completion from aggregate reviewDecision, acknowledgements, summaries, pushes, reply readbacks, body markers, outdated positions, or checks; require GraphQL thread resolution plus exact-current-head CodeRabbit approval.
- Do not infer capacity from elapsed time or a fair-usage table.
- Do not compose ad hoc GitHub polling or silently fall back to unrelated top-level replies.
- Do not request a follow-up review after REVIEW_COMPLETED or bypass persisted single_review_completion.
