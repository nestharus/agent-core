schema: operator-contract-v1
source: agents/prototype-validation-contract-validator.md
model: gpt-high
description: Validate bounded contracts and stop conditions for prototype validation shipping.
inputs:
- {name: truth_branch_ref, type: string, required: false, default_source: caller, description: Truth branch identity for root or topology validation.}
- {name: truth_worktree_path, type: path, required: false, default_source: caller, description: Truth checkout for root or topology validation.}
- {name: eval_branch_ref, type: string, required: false, default_source: caller, description: Eval branch identity for root, topology, or cleanup validation.}
- {name: eval_worktree_path, type: path, required: false, default_source: caller, description: Eval checkout for root or topology validation.}
- {name: planning_dir, type: path, required: false, default_source: caller, description: Durable artifact root.}
- {name: scratch_dir, type: path, required: false, default_source: caller, description: Prompt and log root.}
- {name: proposal_path, type: path, required: false, default_source: caller, description: Proposal or dossier reference.}
- {name: behavior_test_manifest_path, type: path, required: false, default_source: caller, description: Behavior-test identities and expected results.}
- {name: behavior_test_results_path, type: path, required: false, default_source: caller, description: Executed behavior-test results.}
- {name: qa_use_case_manifest, type: path, required: false, default_source: caller, description: QA actions and expected observations.}
- {name: qa_walkthrough_report_path, type: path, required: false, default_source: caller, description: Recorded QA expected-versus-observed results.}
- {name: screenshot_url_manifest_path, type: path, required: false, default_source: caller, description: Uploaded QA screenshot URL manifest.}
- {name: deep_rebuild_evidence_path, type: path, required: false, default_source: caller, description: Clean deep-rebuild command and observed result.}
- {name: package_manifest_path, type: path, required: false, default_source: caller, description: Prototype package manifest.}
- {name: experiment_evidence_bundle_path, type: path, required: false, default_source: caller, description: Experiment-evidence bundle for PR presentation.}
- {name: pr_url, type: string, required: false, default_source: caller, description: Truth-branch draft PR URL.}
- {name: cleanup_report_path, type: path, required: false, default_source: caller, description: Scoped cleanup result.}
- {name: rca_handback_path, type: path, required: false, default_source: caller, description: Prototype RCA handback envelope.}
- {name: cleanup_candidate_manifest_path, type: path, required: false, default_source: caller, description: Exact prototype-scoped cleanup candidates.}
- {name: report_path, type: path, required: true, default_source: caller, description: Validator acceptance or rejection report.}
defaults: []
outputs:
- task: default
  success_shape: Accepted contract-path manifest, structured BLOCKED report, or NEEDS_INPUT question path.
  wrote_lines: ["${report_path}"]
errors:
- {class: BLOCKED, cause: Supplied contract inputs are absent, malformed, inconsistent, or overly broad., recovery: Repair the rejected input set.}
- {class: NEEDS_INPUT, cause: Caller must select a scope, target, credential, branch disposition, or cleanup action., recovery: Answer the emitted question artifact.}
side_effects: [writes-contract-validation-report]
must_delegate: []
forbidden_direct: [run-experiment, package-or-upload-assets, write-pr-prose, delete-resources]
