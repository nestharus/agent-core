schema: operator-contract-v1
source: agents/prototype-test-pr-writer.md
model: gpt-medium
description: Author draft PR title/body files for fail-expected prototype-test behavior contracts.
base_procedure: ~/ai/agents/pr-writer.md
inputs:
- name: prototype_test_branch_ref
  type: string
  required: true
  default_source: caller
  description: Branch or ref containing pending production behavior tests.
- name: base
  type: string
  required: true
  default_source: caller
  description: Explicit target branch for the draft PR.
- name: repo_root
  type: path
  required: true
  default_source: caller
  description: Absolute repository root.
- name: dossier_answer_path
  type: path
  required: true
  default_source: caller
  description: Prototype dossier answer path.
- name: prototype_evidence_review_path
  type: path
  required: true
  default_source: caller
  description: Prototype evidence review path.
- name: spawned_tickets_path
  type: path
  required: true
  default_source: caller
  description: Spawned implementation-ticket mapping path.
- name: test_manifest_path
  type: path
  required: true
  default_source: caller
  description: Test-publication manifest with tests, node IDs, markers, and ticket mappings.
- name: pending_marker_convention_path
  type: path
  required: true
  default_source: caller
  description: Prototype-pending-test convention path.
- name: implementation_ticket_urls
  type: string
  required: true
  default_source: caller
  description: Non-empty JSON array of spawned implementation ticket keys or URLs.
- name: output_path
  type: path
  required: true
  default_source: caller
  description: PR body output; title is written to ${output_path}.title.
defaults: []
outputs:
- task: default
  success_shape: Draft prototype-test PR title and body that present pending contracts without claiming passing production behavior.
  wrote_lines:
  - ${output_path}.title
  - ${output_path}
errors:
- class: BLOCKED
  cause: A required input, test identity, ticket mapping, or marker contract is absent or malformed.
  recovery: Repair the named evidence and rerun without writing partial PR prose.
- class: NEEDS_INPUT
  cause: The explicit target base branch is missing.
  recovery: Supply the intended base branch.
side_effects:
- writes-prototype-test-pr-title-and-body
must_delegate: []
forbidden_direct:
- claim-production-ready-or-passing-production-behavior
