schema: operator-contract-v1
source: agents/prototype-validation-packager.md
model: gpt-high
description: Package shippable prototype deliverables, experiment-evidence bundles, and scoped cleanup reports.
inputs:
- {name: eval_worktree_path, type: path, required: true, default_source: caller, description: Eval-only package staging checkout.}
- {name: truth_branch_ref, type: string, required: true, default_source: caller, description: Truth branch that produced behavior evidence.}
- {name: prototype_slug, type: string, required: true, default_source: caller, description: Exact prototype identity and cleanup scope.}
- {name: registry_target, type: string, required: true, default_source: caller, description: Image registry target.}
- {name: image_tag, type: string, required: true, default_source: caller, description: Exact prototype image tag.}
- {name: zip_path, type: path, required: true, default_source: caller, description: Exact prototype zip output.}
- {name: deliverable_paths, type: path_list, required: true, default_source: caller, description: Compose, Dockerfile, README, and eval-script sources.}
- {name: proposal_or_dossier_path, type: path, required: true, default_source: caller, description: Shipped use-case and expectation reference.}
- {name: behavior_test_results_path, type: path, required: true, default_source: caller, description: Executed behavior-test command, target, expected, observed, status, and output records.}
- {name: qa_walkthrough_report_path, type: path, required: true, default_source: caller, description: Recorded QA action and expected-versus-observed results.}
- {name: deep_rebuild_evidence_path, type: path, required: true, default_source: caller, description: Clean deep-rebuild command and observed result.}
- {name: screenshot_url_manifest_path, type: path, required: true, default_source: caller, description: Uploaded screenshot URLs and captions.}
- {name: pr_context, type: mapping, required: true, default_source: caller, description: Base/truth refs and optional existing PR URL.}
- {name: package_manifest_path, type: path, required: true, default_source: caller, description: Package manifest output.}
- {name: experiment_evidence_bundle_path, type: path, required: true, default_source: caller, description: Experiment-evidence bundle output.}
- {name: cleanup_report_path, type: path, required: false, default_source: caller, description: Cleanup report output for Phase 8 or 8b.}
- {name: cleanup_scope_path, type: path, required: false, default_source: caller, description: Validator-approved exact cleanup scope.}
defaults: []
outputs:
- task: default
  success_shape: Requested package manifest, experiment-evidence bundle, and/or cleanup report.
  wrote_lines: ["${package_manifest_path}", "${experiment_evidence_bundle_path}", "${cleanup_report_path} when requested"]
errors:
- {class: BLOCKED, cause: Packaging, evidence, publication, or cleanup inputs are invalid or the requested output cannot be written., recovery: Repair the named input or destination.}
- {class: NEEDS_INPUT, cause: Caller-owned registry credential, destination, cleanup approval, or publication policy is unresolved., recovery: Answer the emitted question artifact.}
side_effects: [image-publish-when-requested, package-and-bundle-writes, validator-approved-cleanup]
must_delegate: []
forbidden_direct: [upload-screenshots, write-pr-prose, claim-packaging-produced-observed-behavior]
