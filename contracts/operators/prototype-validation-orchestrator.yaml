schema: operator-contract-v1
source: agents/prototype-validation-orchestrator.md
model: gpt-xhigh
description: Orchestrate validation, evidence packaging, PR presentation, and cleanup for a shippable prototype.
inputs:
- {name: truth_branch_ref, type: string, required: true, default_source: caller, description: Branch or commit containing product code and behavior tests.}
- {name: truth_worktree_path, type: path, required: true, default_source: caller, description: Writable truth-branch checkout.}
- {name: eval_branch_ref, type: string, required: true, default_source: caller, description: Eval-only scaffolding branch.}
- {name: eval_worktree_path, type: path, required: true, default_source: caller, description: Writable eval-only checkout.}
- {name: planning_dir, type: path, required: true, default_source: caller, description: Durable validation and shipping artifacts.}
- {name: scratch_dir, type: path, required: true, default_source: caller, description: Transient prompts and logs.}
- {name: proposal_path, type: path, required: true, default_source: caller, description: Proposal or dossier naming shipped use cases and expected observations.}
- {name: behavior_tests_paths, type: path_list, required: true, default_source: caller, description: Behavior-test files or manifest paths.}
- {name: qa_use_case_manifest, type: path, required: true, default_source: caller, description: QA actions, environments, expected observations, and screenshot requirements.}
- {name: registry_target, type: string, required: true, default_source: caller, description: Prototype image registry target.}
- {name: image_tag, type: string, required: true, default_source: caller, description: Exact prototype image tag.}
- {name: zip_path, type: path, required: true, default_source: caller, description: Exact prototype zip output.}
- {name: base_branch, type: string, required: true, default_source: caller, description: Explicit draft-PR base branch.}
- {name: prototype_slug, type: string, required: true, default_source: caller, description: Stable prototype identity and cleanup scope.}
defaults: []
outputs:
- task: default
  success_shape: Truth-branch draft PR evidence plus validated package, experiment-evidence bundle, and optional cleanup artifacts.
  wrote_lines:
  - ${planning_dir}/** validation and shipping artifacts named by the procedure
errors:
- {class: BLOCKED, cause: A required phase contract, experiment record, handback, package, PR, or cleanup boundary is invalid., recovery: Repair the named child evidence and rerun the affected phase.}
- {class: NEEDS_INPUT, cause: A caller-owned scope, credential, registry, branch, or terminal-cleanup decision is unresolved., recovery: Answer the emitted question artifact and resume.}
side_effects: [child-operator-dispatches, truth-and-eval-worktree-writes, package-writes, draft-pr-create-or-refresh, scoped-cleanup]
must_delegate: [contract-validation, screenshot-upload, package-and-evidence-bundle, evidence-bundle-adapter, prototype-rca]
forbidden_direct: [claim-unexecuted-behavior, cross-truth-eval-ownership-boundary]
