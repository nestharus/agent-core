schema: operator-contract-v1
source: agents/pr-review-operator.md
model: gpt-high
description: 'Review PRs: risk assessment, research, test-audit, decomposition, and post comments.'
inputs:
- {name: pr_number, type: int, required: true, default_source: caller, description: pr number}
- {name: repo, type: string, required: false, default_source: derived | caller, description: repo}
- {name: repo_root, type: path, required: true, default_source: caller, description: repo root}
- {name: base_branch, type: string, required: true, default_source: caller, description: 'Caller-supplied expected provider base branch name; provider data verifies but never replaces it.'}
- {name: base_ref, type: string, required: true, default_source: caller, description: 'Caller-supplied fetched remote base ref; it must resolve to provider baseRefOid and never falls back.'}
- {name: base_sha, type: string, required: true, default_source: caller, description: 'Caller-supplied full expected provider base OID.'}
- {name: head_branch, type: string, required: true, default_source: caller, description: 'Caller-supplied expected provider head branch name.'}
- {name: head_ref, type: string, required: true, default_source: caller, description: 'Caller-supplied exact fetched PR head ref.'}
- {name: head_sha, type: string, required: true, default_source: caller, description: 'Caller-supplied full expected provider head OID.'}
- {name: local_coverage_command, type: string, required: true, default_source: caller, description: Non-blank project coverage command passed unchanged to test-audit-gate.}
- {name: review_dir, type: path, required: false, default_source: base, description: 'Stable lineage root only; each invocation derives a new immutable run root from exact PR/base/head/invocation identity beneath it.'}
- {name: planning_root, type: path, required: false, default_source: base, description: planning root}
- {name: agents_dir, type: path, required: false, default_source: base, description: agents dir}
- {name: audit_history_path, type: path, required: false, default_source: derived, description: audit history path}
defaults:
- {name: review_dir, value: '${repo_root}/.tmp/pr-review/${pr_number}', source: base}
- {name: planning_root, value: '${repo_root}/planning', source: base}
- {name: agents_dir, value: ~/ai/agents, source: base}
secrets: []
outputs:
- task: review-pr
  success_shape: pr-review-result-v2 under one immutable run root, with status REVIEW_POSTED or PROPOSAL_POSTED, exact run/provider and repository/PR posting identity, distinct child log/output hashes, nested test-audit proof/revalidation, and every versioned canonical header-first process proof with a producer-owned exact-blocking-mode machine binding.
  wrote_lines:
  - ${review_dir}/runs/<run_id>/pr-review-run.json
  - ${review_dir}/runs/<run_id>/worktree-ownership.json
  - ${review_dir}/runs/<run_id>/pr-meta.json
  - ${review_dir}/runs/<run_id>/diff.txt
  - ${review_dir}/runs/<run_id>/*.log
  - ${review_dir}/runs/<run_id>/result-*.md
  - ${review_dir}/runs/<run_id>/process-proof/initial-v1/{expected-process.json,dispatch-evidence.json,process-tree.json,process-tree-audit.md,process-tree-audit.log}
  - ${review_dir}/runs/<run_id>/process-proof/proposal-round-<NN>-v1/{expected-process.json,dispatch-evidence.json,process-tree.json,process-tree-audit.md,process-tree-audit.log}
  - ${review_dir}/runs/<run_id>/process-proof/domain-<slug>-v1/{expected-process.json,dispatch-evidence.json,process-tree.json,process-tree-audit.md,process-tree-audit.log}
  - ${review_dir}/runs/<run_id>/TEST_AUDIT_GATE.log
  - ${review_dir}/runs/<run_id>/TEST_AUDIT_GATE.md
  - ${review_dir}/runs/<run_id>/TEST_AUDIT_RESULT.json
  - ${review_dir}/runs/<run_id>/TEST_AUDIT_PR_REVALIDATION.json
  - ${review_dir}/runs/<run_id>/justification/final-verdict.md
  - ${review_dir}/runs/<run_id>/worktree-cleanup.json
  - ${review_dir}/runs/<run_id>/PR_REVIEW_RESULT.json
errors:
- {class: BLOCKED, cause: 'Required inputs are missing, unreadable, contradictory, or unsafe for the selected task.', recovery: Supply corrected inputs or select the appropriate operator wrapper before rerun.}
- {class: NEEDS_INPUT, cause: 'A user-owned value, scope, or trade-off question is required.', recovery: Answer the emitted question artifact and resume.}
side_effects:
- gh-pr-read
- review-comment-posting-when-enabled
- scratch-review-artifacts
- git-fetch-and-detached-review-worktree
must_delegate:
- test-audit-gate
- pr-justification-gauntlet
- risk-research-review-children
- supported-surface-review-child
- commit-hygiene-operator
- process-tree-auditor
may_direct:
- gh-pr-metadata-read
- gh-pr-diff-read
forbidden_direct:
- inline-test-audit-or-justification-child-mechanics
